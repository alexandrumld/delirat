<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050505">
  <title>Acord parental — DELIRAT</title>
  <meta name="description" content="Descarcă acordul parental pentru accesul minorilor de 14–17 ani la DELIRAT.">
  <link rel="icon" href="../assets/img/delirat-logo.png" type="image/png">
  <style>
    :root {
      --black: #050505;
      --charcoal: #111111;
      --cream: #d9c7b3;
      --pink: #ff0a8a;
      --violet: #6b1cff;
      --orange: #ff8a00;
      --muted: #8b858a;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--black);
      color: var(--cream);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 24px;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 85% 10%, rgba(255, 10, 138, .14), transparent 27%),
        radial-gradient(circle at 12% 90%, rgba(107, 28, 255, .12), transparent 30%),
        var(--black);
    }

    body::before {
      content: "DELIRAT DELIRAT DELIRAT DELIRAT";
      position: fixed;
      inset: 0;
      overflow: hidden;
      color: rgba(255,255,255,.018);
      font-size: clamp(70px, 15vw, 210px);
      font-weight: 900;
      line-height: .78;
      letter-spacing: -.08em;
      word-break: break-all;
      pointer-events: none;
      transform: rotate(-4deg) scale(1.1);
    }

    .card {
      position: relative;
      z-index: 1;
      width: min(620px, 100%);
      padding: clamp(30px, 7vw, 56px);
      border: 1px solid #392d35;
      background: linear-gradient(180deg, rgba(18,18,18,.98), rgba(8,8,8,.98));
      box-shadow: 0 34px 100px rgba(0,0,0,.66);
      overflow: hidden;
    }

    .card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 76%;
      height: 3px;
      background: linear-gradient(90deg, var(--pink), var(--violet), var(--orange));
    }

    .card::after {
      content: "";
      position: absolute;
      right: -80px;
      bottom: -80px;
      width: 190px;
      height: 190px;
      border: 1px solid rgba(255, 10, 138, .18);
      transform: rotate(45deg);
      pointer-events: none;
    }

    .logo {
      display: block;
      width: 94px;
      height: 94px;
      object-fit: contain;
      margin: 0 auto 22px;
      filter: drop-shadow(0 12px 28px rgba(255, 10, 138, .18));
    }

    .kicker {
      text-align: center;
      color: var(--pink);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .19em;
      text-transform: uppercase;
    }

    h1 {
      margin: 12px 0 16px;
      text-align: center;
      font-size: clamp(35px, 9vw, 66px);
      line-height: .9;
      letter-spacing: -.055em;
      text-transform: uppercase;
    }

    .intro {
      max-width: 470px;
      margin: 0 auto;
      color: #bdb3ad;
      text-align: center;
      line-height: 1.62;
      font-size: 15px;
    }

    .details {
      margin: 27px 0;
      padding: 17px 0;
      border-top: 1px solid #2c252a;
      border-bottom: 1px solid #2c252a;
      text-align: center;
      color: var(--cream);
      font-size: 13px;
      font-weight: 650;
      line-height: 1.7;
      letter-spacing: .02em;
    }

    button {
      width: 100%;
      border: 0;
      appearance: none;
      cursor: pointer;
      padding: 19px 20px;
      background: var(--pink);
      color: var(--black);
      font: inherit;
      font-size: 14px;
      font-weight: 900;
      letter-spacing: .09em;
      text-transform: uppercase;
      transition: transform .2s ease, background .2s ease, opacity .2s ease;
    }

    button:hover { transform: translateY(-2px); background: #ff3aa2; }
    button:active { transform: translateY(0); }
    button:disabled { cursor: wait; opacity: .65; transform: none; }

    .status {
      min-height: 18px;
      margin-top: 13px;
      color: var(--muted);
      text-align: center;
      font-size: 12px;
      line-height: 1.5;
    }

    .back {
      display: block;
      width: fit-content;
      margin: 16px auto 0;
      color: #817a7e;
      text-decoration: none;
      font-size: 12px;
    }

    .back:hover { color: var(--cream); }

    @media (max-width: 520px) {
      body { padding: 14px; }
      .card { padding: 30px 22px 26px; }
      .logo { width: 82px; height: 82px; }
      .intro { font-size: 14px; }
    }
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="../assets/img/delirat-logo.png" alt="Logo DELIRAT">
    <div class="kicker">Acces minori 14–17 ani</div>
    <h1>Acord parental</h1>
    <p class="intro">Descarcă formularul, printează-l și adu-l completat și semnat la intrare, împreună cu actul de identitate în original.</p>

    <div class="details">
      DELIRAT · 1 AUGUST 2026 · 21:00–04:00<br>
      LITTLE CLUB &amp; LOUNGE · TÂRGU MUREȘ
    </div>

    <button id="download" type="button">Descarcă acordul parental</button>
    <div class="status" id="status">PDF · o pagină · pregătit pentru print</div>
    <a class="back" href="/">Înapoi la delirat.com</a>
  </main>

  <script>
    const chunkFiles = Array.from(
      { length: 9 },
      (_, index) => `data/chunk-${String(index + 1).padStart(2, "0")}.txt`
    );

    const button = document.getElementById("download");
    const status = document.getElementById("status");

    button.addEventListener("click", async () => {
      button.disabled = true;
      button.textContent = "Se pregătește...";
      status.textContent = "Pregătim PDF-ul pentru descărcare.";

      try {
        const chunks = await Promise.all(
          chunkFiles.map(async (file) => {
            const response = await fetch(file, { cache: "no-store" });
            if (!response.ok) throw new Error(`Nu s-a putut încărca ${file}`);
            return (await response.text()).trim();
          })
        );

        const binary = atob(chunks.join(""));
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i += 1) {
          bytes[i] = binary.charCodeAt(i);
        }

        const blobUrl = URL.createObjectURL(
          new Blob([bytes], { type: "application/pdf" })
        );

        const link = document.createElement("a");
        link.href = blobUrl;
        link.download = "DELIRAT-Acord-Parental-14-17.pdf";
        document.body.appendChild(link);
        link.click();
        link.remove();

        setTimeout(() => URL.revokeObjectURL(blobUrl), 2000);
        status.textContent = "Descărcarea a început.";
      } catch (error) {
        console.error(error);
        status.textContent = "Nu am putut porni descărcarea. Reîncarcă pagina și încearcă din nou.";
      } finally {
        button.disabled = false;
        button.textContent = "Descarcă acordul parental";
      }
    });
  </script>
</body>
</html>
