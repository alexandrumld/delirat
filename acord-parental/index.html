<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050505">
  <title>Acord parental - DELIRAT</title>
  <meta name="description" content="Descarcă acordul parental pentru accesul participanților de 14-17 ani la DELIRAT.">
  <link rel="icon" href="../assets/img/delirat-logo.png" type="image/png">
  <style>
    :root{--black:#050505;--cream:#D9C7B3;--pink:#FF0A8A;--orange:#FF8A00}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--black)}
    body{min-height:100svh;display:grid;place-items:center;padding:34px 24px;color:var(--cream);font-family:Arial,Helvetica,sans-serif;background:radial-gradient(circle at 85% 10%,rgba(255,10,138,.12),transparent 28%),radial-gradient(circle at 10% 90%,rgba(107,28,255,.10),transparent 30%),var(--black)}
    main{width:min(390px,100%);text-align:center}
    .accent{width:108px;height:4px;margin:0 auto 38px;background:linear-gradient(90deg,var(--pink) 0 68%,var(--orange) 68%)}
    .logo{display:block;width:104px;height:120px;object-fit:contain;margin:0 auto 28px}
    .eyebrow{margin:0 0 14px;color:var(--pink);font-size:12px;font-weight:800;letter-spacing:.18em;text-transform:uppercase}
    h1{margin:0;color:var(--cream);font-size:clamp(30px,8.3vw,38px);line-height:1;letter-spacing:-.04em;white-space:nowrap;text-transform:uppercase}
    .copy{margin:24px auto 30px;color:rgba(217,199,179,.72);font-size:15px;line-height:1.55}
    button,.fallback{display:flex;align-items:center;justify-content:center;width:100%;min-height:62px;border:0;border-radius:0;padding:18px 16px;background:var(--pink);box-shadow:7px 7px 0 var(--orange);color:#050505;font:inherit;font-size:14px;font-weight:900;letter-spacing:.08em;text-decoration:none;text-transform:uppercase;cursor:pointer}
    button:active,.fallback:active{transform:translate(3px,3px);box-shadow:4px 4px 0 var(--orange)}
    button:disabled{opacity:.7;cursor:wait}
    .status{min-height:22px;margin-top:19px;color:var(--pink);font-size:13px;line-height:1.45}
    .fallback{display:none;margin-top:14px;background:transparent;color:var(--cream);border:1px solid rgba(217,199,179,.45);box-shadow:none;min-height:52px;font-size:12px}
    .note{margin:22px 0 0;color:rgba(217,199,179,.42);font-size:12px;line-height:1.55}
    @media(max-width:360px){body{padding-inline:18px}h1{font-size:29px}.copy{font-size:14px}}
  </style>
</head>
<body>
  <main>
    <div class="accent"></div>
    <img class="logo" src="../assets/img/delirat-logo.png" alt="Logo DELIRAT">
    <p class="eyebrow">Participanți 14-17 ani</p>
    <h1>Acord parental</h1>
    <p class="copy">Descarcă formularul, printează-l, completează-l și adu-l la intrare împreună cu actul de identitate.</p>
    <button id="downloadButton" type="button">Descarcă acordul parental</button>
    <a class="fallback" id="fallbackLink" href="../acord-parental.pdf?v=20260731-2" download="DELIRAT-Acord-Parental-14-17.pdf">Deschide PDF-ul</a>
    <div class="status" id="status" aria-live="polite"></div>
    <p class="note">1 august 2026 · 21:00-04:00<br>Little Club &amp; Lounge · Strada Sinaia 3, Târgu Mureș</p>
  </main>
  <script>
    const button=document.getElementById('downloadButton');
    const status=document.getElementById('status');
    const fallback=document.getElementById('fallbackLink');
    const pdfUrl='../acord-parental.pdf?v=20260731-2';

    button.addEventListener('click',async()=>{
      button.disabled=true;
      status.textContent='Se pregătește descărcarea...';
      try{
        const response=await fetch(pdfUrl,{cache:'no-store'});
        if(!response.ok) throw new Error('PDF unavailable');
        const blob=await response.blob();
        const file=new File([blob],'DELIRAT-Acord-Parental-14-17.pdf',{type:'application/pdf'});

        if(navigator.share && navigator.canShare && navigator.canShare({files:[file]})){
          await navigator.share({files:[file],title:'Acord parental DELIRAT'});
          status.textContent='Alege „Salvează în Fișiere” pentru a păstra PDF-ul.';
        }else{
          const url=URL.createObjectURL(blob);
          const link=document.createElement('a');
          link.href=url;
          link.download=file.name;
          document.body.appendChild(link);
          link.click();
          link.remove();
          setTimeout(()=>URL.revokeObjectURL(url),60000);
          status.textContent='PDF-ul a fost descărcat.';
        }
      }catch(error){
        if(error && error.name==='AbortError'){
          status.textContent='Descărcarea a fost anulată.';
        }else{
          status.textContent='Apasă „Deschide PDF-ul”, apoi folosește meniul de distribuire al telefonului.';
          fallback.style.display='flex';
        }
      }finally{
        button.disabled=false;
      }
    });
  </script>
</body>
</html>
